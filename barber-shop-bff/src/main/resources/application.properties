# barber-shop-bff - Backend For Frontend
server.port=8080
spring.application.name=barber-shop-bff

# URLs de microservicios (Client/Adapter Pattern)
product.service.url=http://localhost:8081/api/products
user.service.url=http://localhost:8082/api/users

# Timeouts RestTemplate (ms)
bff.rest.connect-timeout=5000
bff.rest.read-timeout=10000

# CORS (solo frontend → BFF)
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200

# JWT — el BFF validaría el Bearer token aquí en producción (ver JwtSecurityConfig)
# jwt.secret=SHARED_WITH_USER_SERVICE_OR_PUBLIC_KEY
# jwt.expiration-ms=86400000
